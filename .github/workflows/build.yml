name: Build Windows Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller PySide6 pillow

      - name: Generate icon (.ico)
        run: |
          python -c "from PIL import Image; img = Image.open('docs/icons/frp.png').convert('RGBA'); img.save('frp.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name FRPPanelGUI `
            --icon frp.ico `
            --add-data "docs/icons/frp.png;frp.png" `
            frppanel-gui.py

      - name: Build NSIS installer
        shell: pwsh
        run: |
          Copy-Item frp.ico installer\frp.ico
          Copy-Item dist\FRPPanelGUI.exe installer\FRPPanelGUI.exe
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            choco install nsis -y --no-progress
            $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          & $nsis installer\installer.nsi
          Copy-Item installer\FRPPanelGUI-Setup.exe dist\FRPPanelGUI-Setup.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FRPPanelGUI-windows
          path: |
            dist/FRPPanelGUI.exe
            dist/FRPPanelGUI-Setup.exe

      - name: Create Release and Upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FRPPanelGUI.exe
            dist/FRPPanelGUI-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
